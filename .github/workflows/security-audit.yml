name: Security Audit

on:
  schedule:
    # Run weekly on Monday at 8:00 UTC
    - cron: '0 8 * * 1'
  # Also run on manual trigger
  workflow_dispatch:
  # Run on pull requests that touch package.json
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/package.json'

jobs:
  audit:
    name: Security Audit & Dependency Check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        continue-on-error: true
        run: |
          echo "🔒 Checking for vulnerabilities..."
          pnpm audit --audit-level=moderate || true

      - name: Check for outdated packages
        run: |
          echo "📋 Checking for available updates..."
          pnpm outdated || echo "All packages up-to-date"

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint || true

      - name: Comment on PR (if vulnerabilities found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Security audit found issues. Review the audit job logs for details.'
            })
