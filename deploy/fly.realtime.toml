# Aetheria — Fly.io app manifest for apps/realtime.
# Deploy:  fly deploy --config deploy/fly.realtime.toml --dockerfile deploy/Dockerfile.realtime

app = "aetheria-realtime"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.realtime"

[env]
  NODE_ENV = "production"
  REALTIME_HOST = "0.0.0.0"
  REALTIME_PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
