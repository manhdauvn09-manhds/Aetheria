# Aetheria — Fly.io app manifest for apps/api.
# Deploy:  fly deploy --config deploy/fly.api.toml --dockerfile deploy/Dockerfile.api

app = "aetheria-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  API_HOST = "0.0.0.0"
  API_PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 250
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
